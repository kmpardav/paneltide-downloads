ht="24" fill="#172837"/><text x="16" y="512" text-anchor="middle" font-family="Arial" font-size="12" fill="white">1</text></g><defs><clipPath id="p1"><rect width="359" height="519"/></clipPath></defs><g transform="translate(409 32)"><g clip-path="url(#p1)"><rect width="359" height="519" fill="#dce7e4"/><path d="M0 363.29999999999995H359V519H0Z" fill="#b8ccc8"/><circle cx="157.96" cy="285.45000000000005" r="43.08" fill="#f0b662" stroke="#263943" stroke-width="5"/><path d="M179.5 285.45000000000005h96.93m-17.95 0v24m-25.130000000000003-24v18" stroke="#263943" stroke-width="10"/><rect x="12" y="12" rx="12" width="335" height="41" fill="#fffdf6" stroke="#243943" stroke-width="2"/><text x="23" y="35" font-family="Arial,sans-serif" font-size="14" fill="#172837">Dad said to keep it. Just in case.</text></g><rect width="359" height="519" fill="none" stroke="#172837" stroke-width="4"/><rect x="0" y="495" width="32" height="24" fill="#172837"/><text x="16" y="512" text-anchor="middle" font-family="Arial" font-size="12" fill="white">2</text></g><defs><clipPath id="p2"><rect width="359" height="519"/></clipPath></defs><g transform="translate(32 569)"><g clip-path="url(#p2)"><rect width="359" height="519" fill="#dce7e4"/><path d="M0 363.29999999999995H359V519H0Z" fill="#b8ccc8"/><path d="M107.7 129.75h143.6v337.35h-143.6Z" fill="#243d49" stroke="#172837" stroke-width="5"/><path d="M172.32 129.75v337.35" stroke="#f0b662" stroke-width="5"/><circle cx="201.04000000000002" cy="311.4" r="5" fill="#f0b662"/><g transform="translate(71.8 308.29999999999995) scale(0.65)" stroke="#172837" stroke-width="3" stroke-linecap="round"><path d="M-18 34L-31 100L31 100L19 34Z" fill="#e69d70"/><path d="M-10 100L-16 143M13 100L23 143M-23 48L-46 83M23 48L45 74" fill="none"/><ellipse cy="13" rx="17" ry="21" fill="#f2d6bc"/><path d="M-17 12Q-19-15 4-9Q23-10 18 15L8 1Z" fill="#172837"/><path d="M-3 15h2m10 0h2M1 26h8"/></g><rect x="12" y="12" rx="12" width="335" height="117" fill="#fffdf6" stroke="#243943" stroke-width="2"/><text x="23" y="35" font-family="Arial,sans-serif" font-size="14" fill="#172837">I thought this place was empty, but the</text><text x="23" y="54" font-family="Arial,sans-serif" font-size="14" fill="#172837">light is on and someone must have</text><text x="23" y="73" font-family="Arial,sans-serif" font-size="14" fill="#172837">climbed those stairs, even though the</text><text x="23" y="92" font-family="Arial,sans-serif" font-size="14" fill="#172837">harbour master said nobody had been here</text><text x="23" y="111" font-family="Arial,sans-serif" font-size="14" fill="#172837">since the storm that took my father ten</text><g data-overflow="dialogue"><title>Dialogue continues in panel notes. Full text: I thought this place was empty, but the light is on and someone must have climbed those stairs, even though the harbour master said nobody had been here since the storm that took my father ten years ago.</title><rect x="34" y="495" width="325" height="24" fill="#ffe1a3"/><text x="39" y="511" font-family="Arial,sans-serif" font-size="10" fill="#172837">Text continues in notes</text></g></g><rect width="359" height="519" fill="none" stroke="#172837" stroke-width="4"/><rect x="0" y="495" width="32" height="24" fill="#172837"/><text x="16" y="512" text-anchor="middle" font-family="Arial" font-size="12" fill="white">3</text></g><defs><clipPath id="p3"><rect width="359" height="519"/></clipPath></defs><g transform="translate(409 569)"><g clip-path="url(#p3)"><rect width="359" height="519" fill="#dce7e4"/><path d="M0 363.29999999999995H359V519H0Z" fill="#b8ccc8"/><path d="M107.7 129.75h143.6v337.35h-143.6Z" fill="#243d49" stroke="#172837" stroke-width="5"/><path d="M172.32 129.75v337.35" stroke="#f0b662" stroke-width="5"/><circle cx="201.04000000000002" cy="311.4" r="5" fill="#f0b662"/><g transform="translate(71.8 308.29999999999995) scale(0.65)" stroke="#172837" stroke-width="3" stroke-linecap="round"><path d="M-18 34L-31 100L31 100L19 34Z" fill="#e69d70"/><path d="M-10 100L-16 143M13 100L23 143M-23 48L-46 83M23 48L45 74" fill="none"/><ellipse cy="13" rx="17" ry="21" fill="#f2d6bc"/><path d="M-17 12Q-19-15 4-9Q23-10 18 15L8 1Z" fill="#172837"/><path d="M-3 15h2m10 0h2M1 26h8"/></g><rect x="12" y="12" rx="12" width="335" height="41" fill="#fffdf6" stroke="#243943" stroke-width="2"/><text x="23" y="35" font-family="Arial,sans-serif" font-size="14" fill="#172837">Mara?</text></g><rect width="359" height="519" fill="none" stroke="#172837" stroke-width="4"/><rect x="0" y="495" width="32" height="24" fill="#172837"/><text x="16" y="512" text-anchor="middle" font-family="Arial" font-size="12" fill="white">4</text></g></svg>